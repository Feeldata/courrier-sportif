name: Hardening format fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/hardening/v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hardening/v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-hardening.mjs
      - name: Commit formatting
        shell: bash
        run: |
          rm .github/workflows/hardening-format.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format hardening verifier"
          git push origin HEAD:codex/hardening/v0.1
