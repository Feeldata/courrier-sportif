name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full quality gate
        run: npm run check
        env:
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_PROJECT_REF: ci-placeholder-project-ref
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      - name: Ensure build leaves tracked files clean
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
