name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi
      - name: Normalize repository formatting for verification
        run: npm run format
      - name: Export verification worktree
        uses: actions/upload-artifact@v4
        with:
          name: verification-worktree
          path: |
            package-lock.json
            package.json
            scripts
            src
            docs
            eslint.config.mjs
            next.config.ts
            next-env.d.ts
            tsconfig.json
            vitest.config.ts
          if-no-files-found: error
      - run: npm run verify:foundation
      - run: npm run verify:app
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key
