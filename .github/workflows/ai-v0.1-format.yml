name: AI V0.1 format fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/ai/v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ai/v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply project Prettier
        run: npx prettier --write src/modules/ai/pipeline.ts src/modules/ai/ai.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          rm .github/workflows/ai-v0.1-format.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply project formatting to AI verification fix"
          git push origin HEAD:codex/ai/v0.1
