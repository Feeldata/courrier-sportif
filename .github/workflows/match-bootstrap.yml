name: MATCH V0.1 bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'codex/match/v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/match/v0.1
      - name: Apply prepared MATCH V0.1 patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/match-v0.1.tgz
          tar -xzf /tmp/match-v0.1.tgz -C .
          git add src/modules/match docs/match-v0.1.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: implement MATCH V0.1"
            git push origin HEAD:codex/match/v0.1
          fi
