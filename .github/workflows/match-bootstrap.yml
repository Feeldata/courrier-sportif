name: MATCH V0.1 bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'codex/match/v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/match/v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared MATCH V0.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .match-bootstrap/chunk-* | base64 -d > /tmp/match-v0.1.tgz
          echo "d62e561b2cb186d3b3cbf012dbf0a99a0bd6185ebe631c8350c7579564a1c0b2  /tmp/match-v0.1.tgz" | sha256sum -c -
          tar -xzf /tmp/match-v0.1.tgz -C .
          npm ci
          npm run format
          rm -rf .match-bootstrap
          rm .github/workflows/match-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement MATCH V0.1"
          git push origin HEAD:codex/match/v0.1
