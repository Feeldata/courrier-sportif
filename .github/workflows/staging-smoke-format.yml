name: Staging smoke format fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/staging/v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/staging/v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/integration/staging.smoke.ts vitest.staging.config.ts
      - name: Commit formatting
        shell: bash
        run: |
          rm .github/workflows/staging-smoke-format.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format staging smoke harness"
          git push origin HEAD:codex/staging/v0.1
