name: Staging Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'codex/staging/v0.1' || github.head_ref == 'codex/ingest/v0.2' || github.head_ref == 'codex/ingest/elite-one-2025-2026-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://dlilhxaixpnabefqloxs.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yFtYbbcAPpUjkTfsOaJkyA_YXHYGod8
      SUPABASE_PROJECT_REF: dlilhxaixpnabefqloxs
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require staging server secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured as a repository/environment secret."
            exit 1
          fi
      - name: Provision INGEST V0.1 Elite One baseline
        if: github.head_ref == 'codex/ingest/v0.2'
        shell: bash
        run: |
          if [ "$NEXT_PUBLIC_APP_ENV" != "staging" ] ||
             [ "$SUPABASE_PROJECT_REF" != "dlilhxaixpnabefqloxs" ] ||
             [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://dlilhxaixpnabefqloxs.supabase.co" ]; then
            echo "::error::Refusing INGEST V0.1 baseline provisioning outside authorized staging."
            exit 1
          fi

          set +e
          npm run ingest:fecafoot -- --url https://fecafoot-officiel.com/actualite/32843/2026/01/13/ > /tmp/cs-ingest-v01-baseline.log 2>&1
          status=$?
          set -e

          if grep -Fq -- "$SUPABASE_SECRET_KEY" /tmp/cs-ingest-v01-baseline.log; then
            echo "::error::Secret value detected in INGEST V0.1 provisioning stdout/stderr."
            rm -f /tmp/cs-ingest-v01-baseline.log
            exit 1
          fi

          cat /tmp/cs-ingest-v01-baseline.log
          rm -f /tmp/cs-ingest-v01-baseline.log
          exit "$status"
      - name: Run staging smoke without leaking secret
        if: github.head_ref != 'codex/ingest/elite-one-2025-2026-backfill'
        shell: bash
        run: |
          case "$GITHUB_HEAD_REF" in
            codex/staging/v0.1) smoke_script=smoke:staging ;;
            codex/ingest/v0.2) smoke_script=smoke:staging:v02 ;;
            *) echo "::error::Unauthorized staging smoke branch."; exit 1 ;;
          esac
          set +e
          npm run "$smoke_script" > /tmp/cs-staging-smoke.log 2>&1
          status=$?
          set -e

          if grep -Fq -- "$SUPABASE_SECRET_KEY" /tmp/cs-staging-smoke.log; then
            echo "::error::Secret value detected in staging smoke stdout/stderr."
            rm -f /tmp/cs-staging-smoke.log
            exit 1
          fi

          cat /tmp/cs-staging-smoke.log
          rm -f /tmp/cs-staging-smoke.log
          exit "$status"
      - name: Elite One 2025-2026 zero-write staging preflight
        if: github.head_ref == 'codex/ingest/elite-one-2025-2026-backfill'
        shell: bash
        run: |
          set +e
          npm run ingest:fecafoot:v02 -- --backfill-2025-2026-preflight > /tmp/cs-backfill-preflight.log 2>&1
          status=$?
          set -e

          if grep -Fq -- "$SUPABASE_SECRET_KEY" /tmp/cs-backfill-preflight.log; then
            echo "::error::Secret value detected in staging preflight stdout/stderr."
            rm -f /tmp/cs-backfill-preflight.log
            exit 1
          fi

          cat /tmp/cs-backfill-preflight.log
          rm -f /tmp/cs-backfill-preflight.log
          exit "$status"
